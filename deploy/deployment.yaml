# nemik, shipped as snapshots (nemik:W500 / W504; operator ruling 2026-10-15, agreed with luthen-observability,
# the deployer, 2026-10-15). The pod does no graph work at request time and no graph work in a long-lived
# process: a BUILDER container runs `nemik-serve --publish /srv` as a fresh process each time the source
# queues' CONTENT changes (its memory goes back to the OS when it exits; the build's caches persist beside
# the snapshots, W518), and a SERVER container only serves the files (`nemik-static`, W502).
#
# Why: the dynamic server rebuilt the whole graph about once a minute and its heap fragmented: RSS climbed
# ~20 MB per rebuild until the 768Mi limit OOM-killed it (133 readiness and 221 liveness failures in 12 h,
# luthen-observability:W1051). Measured: 80,000 requests (7.3 GB) took the file server from 29.7 to 33.1 MB.
#
# luthen-observability's constraints, carried here:
#   (a) the snapshot volume is disk-backed (NOT Medium: Memory) with a declared sizeLimit, so published files
#       are not charged to a container's memory;
#   (b) the builder rebuilds on a changed content hash (publish skips an unchanged fleet) and has a cpu limit;
#   (c) the server's probes do not depend on the builder: /healthz is liveness, and /metrics (a file the first
#       build wrote) is readiness only until a snapshot exists, after which a dead builder leaves a stale
#       snapshot served rather than a restart;
#   (d) container names and requests/limits go to luthen-observability for its workloads.json row.
# Kept: 2 replicas (zero-downtime ship, operator 2026-09-26), the export PVC read-only (builder only),
# restricted Pod Security. Tenant quota 3Gi: (96Mi + 896Mi) x 3 pods (2 + 1 surge) = 2.9Gi.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nemik
  labels: {app.kubernetes.io/name: nemik}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: nemik}
  template:
    metadata:
      labels: {app.kubernetes.io/name: nemik}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: server
          image: nemik
          command: ["/app/.venv/bin/nemik-static"]
          args: ["--root", "/srv", "--bind", "0.0.0.0", "--port", "8750"]
          ports:
            - {name: http, containerPort: 8750}
          # Measured 29.7 -> 33.1 MB over 80,000 requests; the limit is about three times that.
          resources:
            requests: {memory: 32Mi, cpu: 25m}
            limits: {memory: 96Mi, cpu: 250m}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /metrics, port: http}
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 12
          volumeMounts:
            - {name: snapshots, mountPath: /srv, readOnly: true}
        - name: builder
          image: nemik
          command: ["/bin/sh", "-c"]
          # An unchanged fleet costs one hash pass (about a second); a changed one a build (~16 s CPU warm).
          # A failed build is reported and retried, never fatal: the last snapshot keeps being served.
          args:
            - |
              while true; do
                # nemik:W636: each repo's export is derived from the queue and luthen's withheld list
                # (re-stamped every minute), and the build refuses a list older than 900 s, so a stopped
                # producer fails closed: the last snapshot keeps being served.
                /app/.venv/bin/nemik-exports --root /export --withheld /export/withheld.json --out /tmp/exports \
                  && /app/.venv/bin/nemik-serve --root /export --publish /srv --exports /tmp/exports \
                       --withheld /export/withheld.json --withheld-max-age 900 \
                  || echo "publish failed: $?" >&2
                sleep 30
              done
          env:
            # glibc arenas: one per thread, never returned; two bound the fragmentation (nemik:W260).
            - {name: MALLOC_ARENA_MAX, value: "2"}
            # nemik:W1074: the build's gauges carry the pod, so two builders behind one Service scrape
            # target read apart
            - name: NEMIK_POD
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          # Measured on a pod-shaped export (no git), 17 repos: the build peaked near 530 MB; luthen's 7 d
          # max_over_time of the working set (2026-10-17) read 746 MiB for the builder, uncensored, so the
          # old 768Mi limit sat 3% above it. The quota caps the pair: (96Mi + 896Mi) x 3 pods = 2.9Gi of
          # the 3Gi tenant quota, so 896Mi is the most headroom (20%) the namespace allows (nemik:W505).
          resources:
            requests: {memory: 640Mi, cpu: 250m}
            limits: {memory: 896Mi, cpu: "1"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: export, mountPath: /export, readOnly: true}
            - {name: snapshots, mountPath: /srv}
            # nemik:W1054: the build cache (about 12 MB) outlives the pod, so a new pod starts warm; a cold
            # build needs about 1.03 GiB and 276 s of CPU, and one that is killed before it ends saves nothing
            - {name: cache, mountPath: /srv/.cache}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: export
          persistentVolumeClaim: {claimName: nemik-export, readOnly: true}
        # declared by luthen-observability (its W1643), not here, so a prune of this manifest never deletes it
        - name: cache
          persistentVolumeClaim: {claimName: nemik-cache}
        # disk-backed: the published snapshots are not container memory (four at the peak is ~100 MB)
        - name: snapshots
          emptyDir: {sizeLimit: 256Mi}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
