# nemik-serve, carried over from luthen's terraform/nemik.tf (W82, W146) under namespace nemik's
# `restricted` Pod Security. What changed and why:
#   - the export is the luthen-declared PVC `nemik-export` (read-only), not a hostPath;
#   - the image is the bare name `nemik`, pinned by deploy-state's `images:` entry, not
#     localhost/nemik:built with pullPolicy Never;
#   - runAsNonRoot, seccomp RuntimeDefault, allowPrivilegeEscalation false (restricted requires them).
# Kept: 2 replicas (zero-downtime ship, operator 2026-09-26), Guaranteed 768Mi / 1 cpu (fits the
# 3Gi tenant quota with one surge pod: 3 x 768Mi), readiness and a more lenient liveness on /metrics.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nemik
  labels: {app.kubernetes.io/name: nemik}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: nemik}
  template:
    metadata:
      labels: {app.kubernetes.io/name: nemik}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nemik
          image: nemik
          ports:
            - {name: http, containerPort: 8750}
          # The dashboard's witness tools read these (nemik-45, 2026-09-27). vmsingle and vmalert
          # live in namespace buildbuddy (luthen endpoints.json, read 2026-09-28), so they are named
          # by FQDN now that nemik runs in its own namespace. Re-derive: luthen-observability
          # `checks.endpoints_query vmsingle-http --side pod` (and vmalert-http).
          env:
            - {name: NEMIK_VM_URL, value: "http://vmsingle.buildbuddy.svc.cluster.local:8428"}
            - {name: NEMIK_VMALERT_URL, value: "http://vmalert.buildbuddy.svc.cluster.local:8880"}
            # nemik:W260: OOMKilled at 12:50Z at the old 512Mi (peak working set 536 MB). Measured on
            # the real 16-queue root: 240 MB after the first build, ~315-350 MB once the graph has
            # been rebuilt (a rebuild holds the old graph while the new one is built, and luthen's
            # export changes every minute), ~340 MB after a /cmd. A pod adds its own overhead and
            # concurrent requests on top, so 768Mi (Guaranteed, tenant quota 3Gi at luthen c4b58bd).
            # glibc arenas: one per request thread, never returned; two bound the fragmentation.
            - {name: MALLOC_ARENA_MAX, value: "2"}
          resources:
            requests: {memory: 768Mi, cpu: "1"}
            limits: {memory: 768Mi, cpu: "1"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /metrics, port: http}
            periodSeconds: 10
            failureThreshold: 6
          # A wedged pod stays `running` under readiness alone (2026-09-26); liveness restarts it.
          livenessProbe:
            httpGet: {path: /metrics, port: http}
            periodSeconds: 10
            failureThreshold: 12
          volumeMounts:
            - {name: export, mountPath: /export, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: export
          persistentVolumeClaim: {claimName: nemik-export, readOnly: true}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
