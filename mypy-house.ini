# nemik:W542: the house mypy flags (mtools' [tool.mypy], strict and then some), applied ONLY by
# tools/mypy_ratchet.py against mypy-baseline.json. pyproject.toml's [tool.mypy] stays the lenient
# edit-gate config, for the same reason ruff-house.toml is separate: strict here would refuse every
# edit to a file that already carries findings.
[mypy]
strict = True
extra_checks = True
strict_equality = True
disallow_any_decorated = True
disallow_any_explicit = True
disallow_any_expr = True
python_version = 3.13
warn_unused_ignores = True
warn_unreachable = True
enable_error_code = ignore-without-code, redundant-expr, truthy-bool
explicit_package_bases = True
mypy_path = tests:stubs:tools
