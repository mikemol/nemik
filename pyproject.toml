[project]
name = "nemik"
version = "0.0.0"
description = "Standards-first project management over federated agent workstreams: OSLC state, ForgeFed messages."
requires-python = ">=3.13"
dependencies = [
    "rdflib>=7",
    "pyshacl>=0.26",
    "mikemol-pathsforward",
    "python-dateutil>=2.9",
    "mikemol-hooks",  # nemik: mtools' Claude Code hooks (inbound-asks, nemik-check), installed as nemik's own dependency
    "mikemol-fence",  # nemik:W378: mikemol-membudget beside the interpreter, so mikemol-commit takes its commit lock
    "mikemol-ratchet",  # nemik:W1027: the ratchet census, so the gate can send nemik's ratchet values (mtools:W1909)
    "mikemol-atomicwrite",  # nemik:W1027: mikemol-ratchet's one dependency
    "mikemol-rulerseq",  # nemik:W417: the ruler-sequence generator (mtools:W1048), computed server-side by W418
    "mikemol-converge",  # nemik:W776/W652: the shared converge loop (mtools:W1522), stdlib only; nemik's own copy is gone (W777), tests/test_converge.py runs it
    "mikemol-frontier",  # nemik:W483: the fleet's shared frontier walker (mtools:W1127), rank.frontier reads through it
    "mikemol-transcriptstruct",  # nemik:W1180: mikemol-transcriptstruct beside the interpreter, so a warrant is read from nemik's own install (github-8f)
    "mikemol-icsstruct",  # nemik:W157: operator calendars (W113) read through mtools' lossless iCalendar reader (mtools:W304)  # nemik:W145: RRULE expansion (mtools:W309 stores the rule, nemik expands it)
]

[tool.uv.sources]
# Vendored wheel (nemik:W6, H1): built from mtools' pathsforward at the pinned commit; see
# vendor/wheels/README.md. No network fetch at build time.
mikemol-pathsforward = { path = "vendor/wheels/mikemol_pathsforward-0.1.0+bb2c5c7-py3-none-any.whl" }
mikemol-hooks = { path = "vendor/wheels/mikemol_hooks-0.1.0+bb2c5c7-py3-none-any.whl" }
mikemol-icsstruct = { path = "vendor/wheels/mikemol_icsstruct-0.1.0+bb2c5c7-py3-none-any.whl" }
mikemol-fence = { path = "vendor/wheels/mikemol_fence-0.1.0+bb2c5c7-py3-none-any.whl" }
mikemol-rulerseq = { path = "vendor/wheels/mikemol_rulerseq-0.1.0+bb2c5c7-py3-none-any.whl" }
mikemol-ratchet = { path = "vendor/wheels/mikemol_ratchet-0.1.0+bb2c5c7-py3-none-any.whl" }
mikemol-atomicwrite = { path = "vendor/wheels/mikemol_atomicwrite-0.1.0+bb2c5c7-py3-none-any.whl" }
mikemol-frontier = { path = "vendor/wheels/mikemol_frontier-0.1.0+bb2c5c7-py3-none-any.whl" }
mikemol-cvdcore = { path = "vendor/wheels/mikemol_cvdcore-0.1.0+bb2c5c7-py3-none-any.whl" }
mikemol-transcriptstruct = { path = "vendor/wheels/mikemol_transcriptstruct-0.1.0+bb2c5c7-py3-none-any.whl" }
mikemol-converge = { path = "vendor/wheels/mikemol_converge-0.1.0+0f8267e-py3-none-any.whl" }
mikemol-webpage = { path = "vendor/wheels/mikemol_webpage-0.1.0+146ebaaf-py3-none-any.whl" }
mikemol-otlp = { path = "vendor/wheels/mikemol_otlp-0.1.0+5ba261f-py3-none-any.whl" }
mikemol-endpoints = { path = "vendor/wheels/mikemol_endpoints-0.1.0+5ba261f-py3-none-any.whl" }
paperkit = { git = "https://github.com/mikemol/paperkit.git", rev = "b5877102af3b48005fde814416bff5b8f06ba5cd" }

[project.scripts]
nemik-check = "nemik.check:main"
nemik-collapse = "nemik.check:collapse_main"
nemik-metrics = "nemik.metrics:main"
nemik-serve = "nemik.serve:main"
nemik-static = "nemik.staticserve:main"
nemik-days = "nemik.calendars:days_main"
nemik-calendar-write = "nemik.calwrite:main"
nemik-history = "nemik.history:main"
nemik-pins = "nemik.pins:main"
nemik-critical = "nemik.critical:main"
nemik-work = "nemik.work:main"
nemik-starved = "nemik.starved:main"
nemik-replica = "nemik.replica_cli:main"
nemik-ask = "nemik.ask_cli:main"
nemik-pacing = "nemik.pacing:main"
nemik-export = "nemik.mspdi:main"
nemik-import = "nemik.importer:main"
nemik-exports = "nemik.exportcli:main"
nemik-inbound = "nemik.blocks_cli:main"
nemik-operator = "nemik.blocks_cli:operator_main"
nemik-wake = "nemik.wake:main"
nemik-rank = "nemik.rank:main"
nemik-stackable = "nemik.stackable_cli:main"
nemik-floor-asks = "nemik.floorasks:main"
nemik-overlaps = "nemik.overlaps:main"
nemik-witnesses = "nemik.witnesses_cli:main"
nemik-hostroot = "nemik.hostroot_cli:main"
nemik-ics = "nemik.vtodo:main"
nemik-tasks = "nemik.vtodo:tasks_main"
nemik-stale = "nemik.stale:main"

[project.optional-dependencies]
docs = [
    "paperkit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "jsonschema>=4.23",  # nemik:W441: published documents validate against their generated schemas
    "types-jsonschema",  # its stubs, for the mypy edit gate
    "pyyaml>=6.0",  # nemik:W504: tests/test_deploy_manifest.py reads deploy/*.yaml against the pod shape luthen agreed
    "types-pyyaml",  # its stubs, for the mypy edit gate
    "mikemol-cvdcore",  # nemik:W438/W771: the worst-view colour-blind distance (mtools:W1315), for tests/test_cvd_palette.py; brings numpy and colorspacious
    "mikemol-webpage",  # nemik:W717/W847: the browser-test waits and the waits codemod (mtools:W1684/W1685), stdlib only; used from W848
    "mikemol-otlp",  # nemik:W836/W884: OTLP metric payloads for the wait series (mtools' otlp dist); the host-side emit uses it from W885
    "mikemol-endpoints",  # nemik:W884: otlp's one dist-to-dist dependency, the named-endpoint resolver (mtools:W1419)
]

[tool.pytest.ini_options]
# bazel-* are output symlinks into the Bazel cache; collecting them would run every test twice.
testpaths = ["tests"]
# nemik:W566: tools/ holds importable logic (codon_census, check_run_rows) that its tests import by name
# instead of loading it by path, so mypy sees the types; mypy_path below says the same to mypy.
pythonpath = ["tools"]

[tool.mypy]
# The tests import their sibling helper (tests/installed.py) by bare name, as pytest's rootdir
# import mode resolves it; mypy needs the same directory to find it. Not an exemption: it only
# says where the module lives (the edit gate checks a copy at the repo root, so it needs this).
# nemik:W566/W571: src is a base too, so src/nemik/x.py is module nemik.x whether it is named by path or
# imported through the editable install the image has (else: "Source file found twice under different
# module names: src.nemik.manifest and nemik.manifest", mypy exit 2, in the image's test stage only).
mypy_path = "tests:stubs:tools:src"
