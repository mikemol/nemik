[project]
name = "nemik"
version = "0.0.0"
description = "Standards-first project management over federated agent workstreams: OSLC state, ForgeFed messages."
requires-python = ">=3.13"
dependencies = [
    "rdflib>=7",
    "pyshacl>=0.26",
    "mikemol-pathsforward @ git+https://github.com/mikemol/mtools.git@6857d33d9d43eee291d7d4f805ee5df064893b92#subdirectory=pathsforward",
]

[project.scripts]
nemik-check = "nemik.check:main"
nemik-metrics = "nemik.metrics:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
