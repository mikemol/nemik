[project]
name = "nemik"
version = "0.0.0"
description = "Standards-first project management over federated agent workstreams: OSLC state, ForgeFed messages."
requires-python = ">=3.13"
dependencies = [
    "rdflib>=7",
    "pyshacl>=0.26",
    "mikemol-pathsforward",
    "python-dateutil>=2.9",
    "mikemol-hooks",  # nemik: mtools' Claude Code hooks (inbound-asks, nemik-check), installed as nemik's own dependency
    "mikemol-icsstruct",  # nemik:W157: operator calendars (W113) read through mtools' lossless iCalendar reader (mtools:W304)  # nemik:W145: RRULE expansion (mtools:W309 stores the rule, nemik expands it)
]

[tool.uv.sources]
# Vendored wheel (nemik:W6, H1): built from mtools' pathsforward at the pinned commit; see
# vendor/wheels/README.md. No network fetch at build time.
mikemol-pathsforward = { path = "vendor/wheels/mikemol_pathsforward-0.1.0+842ab10-py3-none-any.whl" }
mikemol-hooks = { path = "vendor/wheels/mikemol_hooks-0.1.0+842ab10-py3-none-any.whl" }
mikemol-icsstruct = { path = "vendor/wheels/mikemol_icsstruct-0.1.0+842ab10-py3-none-any.whl" }
paperkit = { git = "https://github.com/mikemol/paperkit.git", rev = "b5877102af3b48005fde814416bff5b8f06ba5cd" }

[project.scripts]
nemik-check = "nemik.check:main"
nemik-metrics = "nemik.metrics:main"
nemik-serve = "nemik.serve:main"
nemik-days = "nemik.calendars:days_main"
nemik-calendar-write = "nemik.calwrite:main"
nemik-history = "nemik.history:main"
nemik-pins = "nemik.pins:main"
nemik-inbound = "nemik.blocks_cli:main"
nemik-operator = "nemik.blocks_cli:operator_main"
nemik-wake = "nemik.wake:main"
nemik-rank = "nemik.rank:main"
nemik-floor-asks = "nemik.floorasks:main"
nemik-overlaps = "nemik.overlaps:main"
nemik-witnesses = "nemik.witnesses_cli:main"
nemik-ics = "nemik.vtodo:main"
nemik-tasks = "nemik.vtodo:tasks_main"

[project.optional-dependencies]
docs = [
    "paperkit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# bazel-* are output symlinks into the Bazel cache; collecting them would run every test twice.
testpaths = ["tests"]

[tool.mypy]
# The tests import their sibling helper (tests/installed.py) by bare name, as pytest's rootdir
# import mode resolves it; mypy needs the same directory to find it. Not an exemption: it only
# says where the module lives (the edit gate checks a copy at the repo root, so it needs this).
mypy_path = "tests:stubs"
