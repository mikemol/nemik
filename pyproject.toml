[project]
name = "nemik"
version = "0.0.0"
description = "Standards-first project management over federated agent workstreams: OSLC state, ForgeFed messages."
requires-python = ">=3.13"
dependencies = [
    "rdflib>=7",
    "pyshacl>=0.26",
    "mikemol-pathsforward @ git+https://github.com/mikemol/mtools.git@9236d5e525dc074ef73a779ca55478e7ece3dd32#subdirectory=pathsforward",
]

[project.scripts]
nemik-check = "nemik.check:main"
nemik-metrics = "nemik.metrics:main"
nemik-serve = "nemik.serve:main"
nemik-inbound = "nemik.blocks:main"
nemik-operator = "nemik.blocks:operator_main"
nemik-wake = "nemik.wake:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
