[project]
name = "nemik"
version = "0.0.0"
description = "Standards-first project management over federated agent workstreams: OSLC state, ForgeFed messages."
requires-python = ">=3.13"
dependencies = [
    "rdflib>=7",
    "pyshacl>=0.26",
    "mikemol-pathsforward",
]

[tool.uv.sources]
# Vendored wheel (nemik:W6, H1): built from mtools' pathsforward at the pinned commit; see
# vendor/wheels/README.md. No network fetch at build time.
mikemol-pathsforward = { path = "vendor/wheels/mikemol_pathsforward-0.1.0+4de0da4-py3-none-any.whl" }
paperkit = { git = "https://github.com/mikemol/paperkit.git", rev = "b5877102af3b48005fde814416bff5b8f06ba5cd" }

[project.scripts]
nemik-check = "nemik.check:main"
nemik-metrics = "nemik.metrics:main"
nemik-serve = "nemik.serve:main"
nemik-inbound = "nemik.blocks:main"
nemik-operator = "nemik.blocks:operator_main"
nemik-wake = "nemik.wake:main"
nemik-rank = "nemik.rank:main"
nemik-floor-asks = "nemik.floorasks:main"
nemik-overlaps = "nemik.overlaps:main"
nemik-witnesses = "nemik.witnesses:main"

[project.optional-dependencies]
docs = [
    "paperkit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
