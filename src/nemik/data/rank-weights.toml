# Edge weights for nemik-rank's cross-repo downstream weight (nemik:W34, luthen-observability:W117).
#
# ⚑ DECLARED AS DATA, NOT HARD-CODED: how much more a waypoint in ANOTHER repo waiting on this one
# counts than a local successor is a policy choice, not a fact about the graph -- so it lives
# here, where changing it is a reviewed diff, not a constant buried in a traversal.
#
# local:        a downstream waypoint in the same repo.
# peer:         a downstream waypoint in another repo, reachable but not (yet) stalled on this chain.
# peer_blocked: a downstream waypoint in another repo whose status is `blocked` -- a session is
#               sitting idle on it now.
#
# ⚑ HISTORY (residue, not deletion): W35 shipped a two-class {local=1, peer=3}. luthen's case
# (nemik:W38) showed a flat peer multiplier ranks a long, mostly-local reach (luthen W79) above a
# short chain that stalled sessions wait on (luthen W45 -> linux-sources:W124, el-openglo:W127).
# Which repo a waypoint lives in is not the signal; whether someone is stalled on it is (nemik:W36).
local = 1
peer = 2
peer_blocked = 8

# nemik:W249 (operator ruling 2026-10-09: "b", a declared operator class with its own number): what an
# operator ask injects as demand in the flow model, in the same units as the three classes above. A
# card whose caused_by is `operator` (or `operator: ...`) is a demand source of this weight in
# addition to the class it already carries: a ready ask absorbs it, a waiting ask sends it through
# its cone. It replaces the strict `operator` tier (below), so an ask can be outranked by deep work
# and the dial is this one number. 15 is a starting value, chosen from the 2026-10-09 displacement
# measurement (luthen's top salience 56.8, then 14.2, 12.7, 12.5, 9.0). Measured at 15, a leaf ask
# rises within its band, not past a higher band (band outranks weight): luthen W675 from 134th of 135
# to 16th (the old strict tier: 2nd), mtools W593 and W614 from 7th and 8th to 3rd and 4th (2nd and
# 3rd). An ask already high or one whose need is another card (its demand follows its prerequisites)
# barely moves. Change it here, as a reviewed diff.
operator = 15

# nemik:W132 (luthen-observability:W190; operator 2026-09-28: "a parameterizable pareto function"):
# how nemik-rank COMPOSES its objectives into one order. Every objective is maximized:
#   operator  1 when the operator asked for the waypoint (caused_by = operator), else 0 (nemik:W111:
#             "operator ask beats backlog")
#   band      urgency from the vector (data/bands.toml): 0 for the most urgent band, -1 the next ...
#   weight    cross-repo downstream weight (the edge weights above)
# `tiers` are compared lexicographically, one after another. WITHIN a tier, items are split into
# Pareto fronts: the first front is every item no other item in the tier beats on all of the tier's
# objectives. Within a front, `scalarize` orders them by a weighted sum. Remaining ties go to the
# next tier, then to the lower symbol.
#   pure lexicographic: tiers = [["operator"], ["band"], ["weight"]]
#   one Pareto tier:    tiers = [["operator", "band", "weight"]]
# The default trades band against weight: one band step is worth 100 units of weight within a front.
# nemik:W249: the `operator` objective is NOT a tier by default any more. An operator ask lives inside
# `weight` as a demand source (`operator`, above), so it responds to the model instead of sitting
# outside it. To restore the strict tier (an ask beats the backlog regardless of weight, W111):
# tiers = [["operator"], ["band", "weight"]].
[order]
tiers = [["band", "weight"]]

# nemik:W241 (operator ruling, 2026-10-08: the gcalculus model REPLACES the ranking after an audit):
# which model the `weight` objective is.
#   flow        the exact current-flow salience (nemik.flow): each waiting card injects its class
#               weight (local/peer/peer_blocked above, relative to the ranked repo), the demand
#               flows through the cone of what it needs to the ready cards (ground), conserved, and
#               a card's `weight` is the part it absorbs. A source shared by several ready cards is
#               split between them (the operator's ruling: SPLIT, "let the physics do the work").
#   downstream  the old transitive sum, each downstream waypoint counted in full for every ready
#               card that serves it. Kept as the comparison arm: `nemik-rank REPO --flow` prints
#               both and every pair they order differently, with the contested sources behind each.
# AUDIT (W240, all sixteen workstreams): the arms differ only where a source is shared; the
# differences close exactly (design note, "The audit, run on every workstream").
weight = "flow"

# nemik:W253: what ONE recorded gap (a residue entry of the realizability policy, mtools:W850) weighs
# as demand at the card that bears it, by gate, for `nemik-rank REPO --flow --residue`. Unit weights
# measured badly: over the 1,563 judged cards the gaps sit at coverable 1,550 (99%, "no population
# declared"), observable 1,019 (65%, "no witness or evidence"), constructible 131 (8%, mostly "no
# next_bounded_step") and reachable 61 (4%, a reference that resolves to nothing). The first two are
# paperwork nearly every card shares; counting them ranks a card by how little it says, not by what
# working it would unblock. They weigh 0 until a reason is declared here; the two rare gates, which
# name something specific to fix, weigh 1.
[residue]
constructible = 1
reachable = 1
observable = 0
coverable = 0

[order.scalarize]
operator = 1
band = 100
weight = 1

# nemik:W299 (operator 2026-10-10: the waiting-on-operator machinery carries the salience signal):
# the RFC 5545 PRIORITY (1 highest .. 9 lowest) nemik-ics gives an operator ask by the flow salience it
# holds back. A floor of salience and the level it earns; the highest floor reached wins, and an ask
# below every floor is 9. 2026-10-10's 83 needs-you asks ranged 86.0 down to 0: the top three were 86,
# 47 and 32, a long middle sat at 15 (a ready class weight), and over half held back nothing.
[ask_priority]
"40" = 1
"15" = 3
"5" = 5
"0.01" = 7

# nemik:W460 (github-8f ruling 2026-10-13): in these repos an act that reads like a machine act ("apply
# for Medicaid", a "drill" session) is the operator's own errand, not an unwritten tool. Errands are
# listed by nemik-operator only: never counted in the tool backlog, never published by the view.
[errand]
repos = ["life"]

# nemik:W326: a ready card that waited longer than this many days while newer cards ranked above it
# is STARVED (nemik-starved). Reporting only: ranking has no aging term, by choice.
[starvation]
days = 14

# nemik:W317: repo health (nemik.health). Each signal declares [amber, red]; a repo is as unhealthy as its
# worst. oldest_block_ticks counts loop ticks; asks_owed counts needs-you asks. Calibrated 2026-10-11 to the
# measured fleet (16 repos: shares 0-0.99, longest blocks 0-176 ticks, asks 0-19), so the verdict discriminates.
[health]
blocked_share = [0.7, 0.9]
oldest_block_ticks = [50, 150]
asks_owed = [5, 12]

# nemik:W348: more open needs-you operator asks than this in one repo is a nemik-check Warning (the operator is
# that repo's bottleneck). 2026-10-12 fleet: 0-19 per repo; 10 flags the four heaviest.
[saturation]
needs_you_per_repo = 10

# nemik:W600 (operator burn-down priority, 2026-10-16, relayed by github-8f): which repos the fleet's
# frontier is burned down in first. A mark for ordering and for grouping the view, never a gate: a
# repo in a later tier still works its own queue. Each repo appears in exactly one tier.
[tiers]
now = ["el-openglo", "gcalculus", "linux-sources", "luthen-observability", "mtools", "nemik", "summit"]
later = ["paperkit", "substrate", "rosettapkg"]
only-when-blocking = ["aeternum", "amr-skills"]
lowest = ["gabion"]

# nemik:W597: phrases (matched lowercase, as substrings) by which a card's prose claims an operator ruling;
# an open card using one with no `warrants` list is a nemik-check Warning (UnwarrantedRulingShape).
[rulings]
words = ["operator ruling", "operator ruled", "operator said", "operator decided", "per the operator", "operator approved", "operator via"]

# nemik:W356: a card blocked on another repo's open card for more than this many loop ticks is a nemik-check
# Warning on the blocker's card (that repo can act). 48 ticks is a day at the 30-minute cadence.
[sla]
cross_repo_ticks = 48

# nemik:W577 (github-8f 2026-10-16): a repo whose last `ticks` tick-lines all end in an `outcomes` value
# while it has no ready or working card is a nemik-check Warning: disarm the loop, or block a card on
# what it waits for. 16 ticks is eight hours at the 30-minute cadence (the loop skill escalates at 16).
[idle]
ticks = 16
outcomes = ["idle"]

# nemik:W327: arrival pacing (nemik-pacing), a token bucket over each repo's new cards: `rate` per day,
# `burst` on top, over `window_days`. Measured 2026-10-12 over 14 days: daily medians 2 to 53, peaks to
# 844 (a bulk import). Report only; enforcing a pace is a separate decision.
[pacing]
rate = 50
burst = 150
window_days = 14

# nemik:W608: the warrant debt may only fall. Each repo's count of open cards claiming an operator ruling with no
# warrant (nemik:W597) on 2026-10-17, 72 in all; nemik-check warns on a repo above its number (a repo not listed has
# a ceiling of zero). Lower a number in the change that warrants its cards.
[warrant_debt]
aeternum = 2
amr-skills = 2
el-openglo = 7
gabion = 4
gcalculus = 2
github = 1
life = 3
linux-sources = 1
luthen-observability = 16
mtools = 14
nemik = 6
paperkit = 6
rosettapkg = 1
substrate = 6
summit = 1

# nemik:W685: the most ready cards without a manifest each repo may carry. Measured 2026-10-18 with
# nemik-check --unmanifested, never typed as a cap; lower a value when a repo's count falls.
[manifest_ratchet]
aeternum = 0
amr-skills = 1
el-openglo = 1
gabion = 0
gcalculus = 1
github = 14
life = 1
linux-sources = 1
luthen-observability = 3
mtools = 15
nemik = 0
paperkit = 0
resumes = 1
rosettapkg = 0
substrate = 0
summit = 0

# nemik:W699: the demand one loop tick of a card's ticks_blocked adds, so the cards it waits on rank
# higher the longer the wait. Zero is the ranking without it; raising it re-baselines the rank tests.
[wait_age]
per_tick = 0
