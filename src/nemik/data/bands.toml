# nemik:W131 (luthen-observability:W190): how a waypoint's vector becomes a priority band.
#
# Declared data, not code: nemik owns composition (mtools stores and validates the WV:1 vector,
# mtools:W248). Bands are listed most urgent first. A waypoint takes the FIRST band that has a rule
# it matches; a rule matches when every metric it names has one of the listed values (AND within a
# rule, OR across a band's rules). A vector no rule matches takes `unmatched`; a waypoint with no
# vector takes `unscored` -- declared here, never a silent zero, and never written into the queue.
#
# Metrics (mtools vector.py, luthen W218): R reach L|T|C|H (local, tenant, cluster, host),
# E egress Y|N, C/I/A impact N|L|H, X precondition N|P, S scope U|C (C = crosses a trust boundary),
# F fix known K|U, W witness Y|N.
#
# These first rules are a starting calibration against luthen's live trust-boundary items (W188);
# luthen, the first consumer, may propose changes by letter.

order = ["critical", "high", "elevated", "normal", "low"]
unscored = "normal"
unmatched = "normal"

# Host reach across a trust boundary, host integrity, or confidential data leaving the host.
[[band.critical]]
R = ["H"]
S = ["C"]
[[band.critical]]
R = ["H"]
I = ["H"]
[[band.critical]]
E = ["Y"]
C = ["H"]

# Cluster reach, any trust-boundary crossing, or high confidentiality/integrity impact.
[[band.high]]
R = ["C"]
[[band.high]]
S = ["C"]
[[band.high]]
C = ["H"]
[[band.high]]
I = ["H"]

# Tenant reach, or availability at risk.
[[band.elevated]]
R = ["T"]
[[band.elevated]]
A = ["H"]

# Local, and no impact at all.
[[band.low]]
R = ["L"]
C = ["N"]
I = ["N"]
A = ["N"]

# nemik:W133 (luthen-observability:W190 §3): ordering guarantees `nemik-rank --check` REFUSES on.
# They are rules, not weights: the composed order above may break one (an operator ask outranks
# any band, W111), and --check then names the rule and the pair of items that broke it.
#
# floor: nothing below this band may be the item the session works next while a ready item at
# this band or above exists. Starts at the top band, the narrowest claim; luthen may lower it.
[guarantee]
floor = "critical"

# A policy class blocks every ready waypoint in the same repo that shares a touches tag (a
# surface) with one of the class's open members. A waypoint is in the class when its touches
# carry `tag`, or its vector matches a `vector` rule (same grammar as a band rule). Members of the
# class are never blocked by one another: they are the fix work itself. An optional `only = [tags]`
# narrows the dependents to those carrying one of the tags (nemik:W138, e.g. only tenant-facing
# rollouts); without it every dependent on a shared surface is blocked.
[[policy]]
class = "trust-boundary"
tag = "trust-boundary"
[[policy.vector]]
S = ["C"]
